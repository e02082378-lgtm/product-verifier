<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Belge Doğrulama - Near East University</title>
  <!-- Supabase JS Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      background-color: #ffffff;
      color: #333;
    }
    header {
      background-color: #1f1f1f;
      color: #fff;
      text-align: center;
      padding: 12px;
      font-size: 13px;
      font-style: italic;
    }
    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 15px;
    }
    .search-card {
      background-color: #f2f2f2;
      border-radius: 4px;
      padding: 30px 20px;
      text-align: center;
    }
    .instructions-tr {
      font-size: 13px;
      font-weight: bold;
      color: #000;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .instructions-en {
      font-size: 12px;
      font-style: italic;
      color: #333;
      margin-bottom: 25px;
    }
    .form-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }
    .field-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .field-group label {
      font-size: 11px;
      font-style: italic;
      text-align: right;
      line-height: 1.2;
    }
    .field-group input {
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 2px;
      width: 170px;
      font-size: 13px;
    }
    .btn-submit {
      background-color: #337ab7;
      color: white;
      border: 1px solid #2e6da4;
      padding: 8px 30px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 3px;
      cursor: pointer;
      text-transform: uppercase;
    }
    .btn-submit:hover {
      background-color: #286090;
    }
    .btn-submit:disabled {
      background-color: #a0a0a0;
      border-color: #888888;
      cursor: not-allowed;
    }
    .result-box {
      margin-top: 25px;
      text-align: left;
      font-size: 14px;
    }
    .status-alert {
      padding: 15px;
      border-radius: 4px;
      margin-top: 15px;
    }
    .status-success {
      background-color: #dff0d8;
      border: 1px solid #d6e9c6;
      color: #3c763d;
    }
    .status-error {
      background-color: #f2dede;
      border: 1px solid #ebccd1;
      color: #a94442;
    }
    footer {
      text-align: center;
      margin-top: 100px;
      font-size: 11px;
      font-style: italic;
      color: #337ab7;
    }
  </style>
</head>
<body>

  <header>
    Yakın Doğu Üniversitesi
  </header>

  <div class="container">
    <div class="search-card">
      <div class="instructions-tr">
        ARATMAK İSTEDİĞİNİZ BELGE KODUNU VE BELGEDE YAZAN PASAPORT NUMARASINI AŞAĞIDAKİ ALANA YAZINIZ!
      </div>
      <div class="instructions-en">
        Please enter the document code to be queried and the passport number indicated on the document in the field below.
      </div>

      <form id="verifyForm" onsubmit="handleVerify(event)">
        <div class="form-row">
          <div class="field-group">
            <label>Digital<br>Sign :</label>
            <input type="text" id="digitalSignInput" required autocomplete="off">
          </div>

          <div class="field-group">
            <label>Passport<br>No :</label>
            <input type="text" id="passportInput" required autocomplete="off">
          </div>
        </div>

        <div>
          <button type="submit" id="submitBtn" class="btn-submit">SORGULA</button>
        </div>
      </form>

      <div id="resultArea" class="result-box"></div>
    </div>
  </div>

  <footer>
    &copy; 2017 - Near East Technology
  </footer>

  <script>
    // تهيئة الاتصال بـ Supabase باستخدام البيانات الخاصة بك
    const SUPABASE_URL = 'https://rohqqczljpeewgmbnfft.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJvaHFxY3psanBlZXdnbWJuZmZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwNTg5OTQsImV4cCI6MjEwNjYzNDk5NH0.gyQ-CIizT3_E0x3YLeeBI4cd2JRkXj2ZklyRWR0Ejpk';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function handleVerify(e) {
      e.preventDefault();

      const digitalSign = document.getElementById('digitalSignInput').value.trim();
      const passportNo = document.getElementById('passportInput').value.trim();
      const resultArea = document.getElementById('resultArea');
      const submitBtn = document.getElementById('submitBtn');

      resultArea.innerHTML = '';
      submitBtn.disabled = true;
      submitBtn.innerText = 'Sorgulanıyor...';

      try {
        // الاستعلام من جدول documents
        const { data, error } = await supabaseClient
          .from('documents')
          .select('*')
          .eq('digital_sign', digitalSign)
          .eq('passport_no', passportNo)
          .maybeSingle();

        if (error) {
          throw error;
        }

        if (data) {
          resultArea.innerHTML = `
            <div class="status-alert status-success">
              <h4 style="margin-bottom: 10px;">Belge Doğrulandı / Document Verified ✓</h4>
              <p><strong>Öğrenci Adı / Name:</strong> ${data.student_name || '-'}</p>
              <p><strong>Fakülte / Faculty:</strong> ${data.faculty || '-'}</p>
              <p><strong>Düzenleme Tarihi / Issue Date:</strong> ${data.issue_date || '-'}</p>
              <p><strong>Durum / Status:</strong> ${data.status || 'Geçerli (Valid)'}</p>
            </div>
          `;
        } else {
          resultArea.innerHTML = `
            <div class="status-alert status-error">
              Belge bulunamadı. Lütfen bilgileri kontrol edip tekrar deneyiniz.<br>
              <small>Document not found. Please check your information and try again.</small>
            </div>
          `;
        }
      } catch (err) {
        console.error(err);
        resultArea.innerHTML = `
          <div class="status-alert status-error">
            Sistem hatası oluştu. Lütfen أكثر لاحقاً.
          </div>
        `;
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'SORGULA';
      }
    }
  </script>
</body>
</html>
